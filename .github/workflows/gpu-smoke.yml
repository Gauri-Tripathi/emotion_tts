name: GPU engine smoke test
on:
  workflow_dispatch:
    inputs:
      engine:
        description: Validated engine id
        required: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v6
      - run: echo "GPU smoke harness must be configured for ${{ inputs.engine }} on this runner"
