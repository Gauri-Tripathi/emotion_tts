<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniTTS Studio</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Local synthesis workspace</p>
        <h1>UniTTS Studio</h1>
      </div>
      <div class="server-state" id="server-state">Connecting</div>
    </header>

    <section class="workspace" aria-label="Text to speech workspace">
      <aside class="settings-panel">
        <label class="field">
          <span>Provider</span>
          <select id="provider" aria-label="Provider"></select>
        </label>
        <div class="provider-meta" id="provider-meta"></div>

        <div class="field-group">
          <label class="field">
            <span>Language</span>
            <input id="language" value="en" autocomplete="off">
          </label>
          <label class="field">
            <span>Voice</span>
            <input id="voice" placeholder="Provider default" autocomplete="off">
          </label>
        </div>

        <label class="field">
          <span>Speed <output id="speed-value">1.0x</output></span>
          <input id="speed" type="range" min="0.7" max="1.3" value="1" step="0.05">
        </label>

        <div class="divider"></div>

        <label class="field">
          <span>Reference audio</span>
          <input id="reference-audio" type="file" accept="audio/*">
        </label>
        <label class="field">
          <span>Reference transcript</span>
          <textarea id="reference-text" rows="3" placeholder="Needed by cloning providers"></textarea>
        </label>

        <details class="advanced">
          <summary>Advanced</summary>
          <label class="field">
            <span>Model override</span>
            <input id="model" placeholder="Provider default" autocomplete="off">
          </label>
          <label class="field">
            <span>Device</span>
            <select id="device">
              <option value="auto">Auto</option>
              <option value="cuda">CUDA</option>
              <option value="cpu">CPU</option>
            </select>
          </label>
        </details>
      </aside>

      <section class="composer">
        <div class="composer-heading">
          <label for="text">Text</label>
          <span id="char-count">0 characters</span>
        </div>
        <textarea id="text" class="text-editor" placeholder="Write something to synthesize..."></textarea>
        <div class="composer-footer">
          <p id="request-note">Choose a provider to view its supported features.</p>
          <button id="synthesize" class="primary-action" type="button" disabled>Synthesize</button>
        </div>
      </section>
    </section>

    <section class="result-panel" aria-live="polite">
      <div class="result-copy">
        <p class="eyebrow">Output</p>
        <h2 id="result-title">No audio generated</h2>
        <p id="result-message">Your finished audio will appear here.</p>
      </div>
      <div class="audio-controls">
        <audio id="audio" controls></audio>
        <a id="download" class="download-action" download="unitts-output.wav" hidden>Download WAV</a>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
